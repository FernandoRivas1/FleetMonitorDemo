# Render Blueprint for the FleetMonitor Demo backend.
# https://render.com/docs/blueprint-spec
#
# Deploy via the Render dashboard: New -> Blueprint -> select this repo.
# DATABASE_URL, ALLOWED_ORIGINS, and ANTHROPIC_API_KEY are marked sync:false
# so Render prompts for them instead of storing secrets in this file.
services:
  - type: web
    name: fleetmonitor-demo-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: FLEET_MIN
        value: "15"
      - key: FLEET_MAX
        value: "20"
